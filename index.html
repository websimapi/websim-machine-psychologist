<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Machine Psychologist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Layout */
    body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; color: #333; }
    #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
    header, footer { background: #0078D7; color: white; padding: 1rem; text-align: center; }
    main { display: grid; grid-template-columns: 200px 1fr; overflow: hidden; }
    #sidebar { background: #f4f4f4; border-right: 1px solid #ddd; overflow-y: auto; }
    #sidebar ul { list-style: none; padding: 0; margin: 0; }
    #sidebar li { padding: 0.8rem; cursor: pointer; border-bottom: 1px solid #ddd; }
    #sidebar li:hover, #sidebar .active { background: #e0e7f1; }
    #experiment { padding: 1rem; overflow-y: auto; }
    textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.5rem; font-size: 1rem; }
    button { margin-top: 1rem; padding: 0.6rem 1.2rem; font-size: 1rem; background: #0078D7; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #output { margin-top: 1rem; white-space: pre-wrap; background: #fafafa; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; min-height: 120px; }
    /* Spinner */
    .spinner { border: 4px solid #ddd; border-top: 4px solid #0078D7; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 0.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- import map for websim library -->
  <script type="importmap">
  {
    "imports": {
      "websim": "https://cdn.jsdelivr.net/npm/web-simulator-lib@1.0.0/dist/websim.esm.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Machine Psychologist</h1>
    </header>
    <main>
      <nav id="sidebar">
        <ul></ul>
      </nav>
      <section id="experiment">
        <h2 id="exp-title"></h2>
        <p id="exp-desc"></p>
        <div id="exp-input"></div>
        <button id="run-btn">Run Test</button><span id="loading"></span>
        <div id="output"></div>
      </section>
    </main>
    <footer>
      Credits: Based on research article (<a href="#" style="color: #ffecb3;">source</a>)
    </footer>
  </div>

  <script type="module">
    import websim from "websim";

    const experiments = {
      freeform: {
        title: "Freeform Prompt",
        desc: "Enter any prompt to test the LLM's behavior.",
        render: container => {
          container.innerHTML = '<textarea id="free-prompt" rows="4" placeholder="Type your prompt here…"></textarea>';
        },
        buildPrompt: () => document.getElementById("free-prompt").value.trim()
      },
      ambiguity: {
        title: "Ambiguity Interpretation",
        desc: "Provide an ambiguous sentence. The model will list two interpretations.",
        render: container => {
          container.innerHTML = '<textarea id="amb-sent" rows="3" placeholder="Enter an ambiguous sentence…"></textarea>';
        },
        buildPrompt: () => {
          const s = document.getElementById("amb-sent").value.trim();
          return `The following sentence is ambiguous. Provide two distinct interpretations and explain each one:\n\n"${s}"`;
        }
      },
      priming: {
        title: "Priming Effect Test",
        desc: "Enter a priming text and then a neutral question. Observe how the prime influences the answer.",
        render: container => {
          container.innerHTML = `
            <textarea id="prime-text" rows="3" placeholder="Enter priming text…"></textarea>
            <textarea id="neutral-q" rows="2" placeholder="Enter your question…"></textarea>
          `;
        },
        buildPrompt: () => {
          const prime = document.getElementById("prime-text").value.trim();
          const q = document.getElementById("neutral-q").value.trim();
          return `Read the following text as context (prime):\n${prime}\n\nThen answer this question:\n${q}`;
        }
      }
    };

    const sidebarUl = document.querySelector("#sidebar ul");
    const expTitle = document.getElementById("exp-title");
    const expDesc = document.getElementById("exp-desc");
    const expInput = document.getElementById("exp-input");
    const runBtn = document.getElementById("run-btn");
    const output = document.getElementById("output");
    const loading = document.getElementById("loading");

    let activeKey = null;

    function selectExperiment(key) {
      activeKey = key;
      // highlight
      Array.from(sidebarUl.children).forEach(li => li.dataset.key === key
        ? li.classList.add("active")
        : li.classList.remove("active"));
      // render UI
      const exp = experiments[key];
      expTitle.textContent = exp.title;
      expDesc.textContent = exp.desc;
      exp.render(expInput);
      output.textContent = "";
    }

    // populate sidebar
    Object.keys(experiments).forEach(key => {
      const li = document.createElement("li");
      li.textContent = experiments[key].title;
      li.dataset.key = key;
      li.onclick = () => selectExperiment(key);
      sidebarUl.appendChild(li);
    });

    // default select
    selectExperiment(Object.keys(experiments)[0]);

    runBtn.addEventListener("click", async () => {
      const prompt = experiments[activeKey].buildPrompt();
      if (!prompt) return alert("Please fill in the input.");
      runBtn.disabled = true;
      loading.innerHTML = '<span class="spinner"></span>';
      output.textContent = "";
      try {
        const res = await websim.chat.completions.create({
          messages: [{ role: "system", content: "You are a helpful assistant." },
                     { role: "user", content: prompt }],
        });
        output.textContent = res.content || res;
      } catch (err) {
        output.textContent = "Error: " + err.message;
      } finally {
        runBtn.disabled = false;
        loading.innerHTML = "";
      }
    });
  </script>

</body>
</html>
